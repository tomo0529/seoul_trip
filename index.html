<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ソウル旅行 行き先アンケート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ee; --card:#fffdf9; --ink:#1d1b19; --sub:#6d665e; --line:#e4ddd2;
    --red:#d2382b; --blue:#1f4e9c; --must:#d2382b; --maybe:#e2a72e; --pass:#b9b2a8;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 140px}

  header{padding:28px 0 18px;position:relative}
  .eyebrow{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--sub)}
  .taegeuk{width:22px;height:22px;flex:none}
  h1{font-size:clamp(26px,6vw,36px);font-weight:900;line-height:1.2;margin:10px 0 8px;letter-spacing:-.01em}
  h1 em{font-style:normal;color:var(--red)}
  .lead{color:var(--sub);font-size:14px;line-height:1.7;margin:0}

  .namebox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:18px 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .namebox label{font-weight:700;font-size:14px}
  .namebox select{flex:1;min-width:140px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
  .namebox select:focus{outline:2px solid var(--blue);outline-offset:1px}
  .guide{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--sub);margin:10px 2px 0}
  .guide a{color:var(--blue);font-weight:700;text-decoration:none;border-bottom:1px solid #c5d3ea}
  .links{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .links a{font-size:12px;font-weight:700;color:var(--blue);text-decoration:none;background:#eef2f9;border-radius:8px;padding:5px 9px}
  .links a:active{background:#dce5f4}

  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:10px 2px 0}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}

  nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;margin-top:12px;border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;white-space:nowrap}
  .tab .cnt{font-weight:500;color:var(--sub);font-size:12px;margin-left:4px}
  .tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tab[aria-selected="true"] .cnt{color:#cfc8bf}

  .sechead{margin:20px 2px 12px}
  .sechead h2{font-size:20px;margin:0 0 4px;font-weight:900}
  .sechead p{margin:0;color:var(--sub);font-size:13px;line-height:1.6}

  .grid{display:grid;gap:10px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;grid-template-columns:44px 1fr;gap:4px 12px;transition:border-color .15s, box-shadow .15s}
  .item.v2{border-color:var(--must);box-shadow:inset 4px 0 0 var(--must)}
  .item.v1{border-color:var(--maybe);box-shadow:inset 4px 0 0 var(--maybe)}
  .emo{font-size:30px;line-height:44px;text-align:center;grid-row:span 2}
  .ttl{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
  .ttl b{font-size:16px}
  .tag{font-size:11px;color:var(--blue);background:#e8eef8;border-radius:6px;padding:2px 6px;font-weight:700}
  .desc{font-size:13px;color:var(--sub);line-height:1.6;margin:0}
  .votes{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .vb{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-size:13px;font-weight:700}
  .vb[aria-pressed="true"][data-v="2"]{background:var(--must);border-color:var(--must);color:#fff}
  .vb[aria-pressed="true"][data-v="1"]{background:var(--maybe);border-color:var(--maybe);color:#fff}
  .vb[aria-pressed="true"][data-v="0"]{background:var(--pass);border-color:var(--pass);color:#fff}

  textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:var(--radius);padding:12px;font:inherit;font-size:15px;background:#fff;resize:vertical}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(246,243,238,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .bar .in{max-width:760px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
  .prog{flex:1;font-size:12px;color:var(--sub);line-height:1.4}
  .prog strong{color:var(--ink);font-size:14px}
  .btn{border:none;border-radius:12px;padding:12px 16px;font-weight:900;font-size:14px}
  .btn.primary{background:var(--red);color:#fff}
  .btn.ghost{background:var(--card);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:default}

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* results */
  .status{font-size:13px;color:var(--sub);background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:12px 14px;line-height:1.7;margin-bottom:12px}
  .voters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
  .chip{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:#fff;border:1px solid var(--line)}
  .rcat{margin:22px 0 8px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
  .rrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
  .rank{font-weight:900;font-size:15px;text-align:center;color:var(--sub)}
  .rrow.top .rank{color:var(--red)}
  .rname{font-weight:700;font-size:14px}
  .rwho{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5}
  .rwho .m{color:var(--must);font-weight:700}
  .rwho .y{color:#b07d10;font-weight:700}
  .meter{display:flex;gap:2px;align-items:center}
  .meter i{width:9px;height:18px;border-radius:3px;background:#ece6dc;display:block}
  .meter i.m{background:var(--must)}
  .meter i.y{background:var(--maybe)}
  .score{font-size:12px;color:var(--sub);text-align:right;margin-top:2px}
  .comments .cm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:14px;line-height:1.6;white-space:pre-wrap}
  .comments .cm b{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
  .empty{color:var(--sub);font-size:14px;padding:20px 4px}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">
      <svg class="taegeuk" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="48" fill="#1f4e9c"/>
        <path d="M2,50 a48,48 0 0 1 96,0 a24,24 0 0 1 -48,0 a24,24 0 0 0 -48,0z" fill="#d2382b"/>
      </svg>
      SEOUL TRIP · 4/23–4/25 · 4人
    </div>
    <h1>ソウルで<em>どこ行く？何食べる？</em><br>アンケート</h1>
    <p class="lead">宿も行き先もまだ白紙なので、気になるものに印つけてってください。全部答えなくてOK。<br>最後に「保存」を押せば集計に反映されるよ（あとから何回でも直せる）。</p>
  </header>

  <div class="namebox">
    <label for="name">あなたの名前</label>
    <select id="name">
      <option value="">選んでね</option>
      <option value="takuya">たくや</option>
      <option value="kensan">けんさん</option>
      <option value="takechan">たけちゃん</option>
      <option value="ryohe">りょへ</option>
    </select>
  </div>
  <div class="guide">
    <span>📖 下調べ用：</span>
    <a href="https://japanese.visitkorea.or.kr/" target="_blank" rel="noopener">韓国観光公社（日本語）</a>
    <a href="https://www.konest.com/" target="_blank" rel="noopener">コネスト</a>
    <a href="https://map.naver.com/" target="_blank" rel="noopener">NAVERマップ</a>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:var(--must)"></i>#マスト＝2点</span>
    <span><i class="dot" style="background:var(--maybe)"></i>#できれば＝1点</span>
    <span><i class="dot" style="background:var(--pass)"></i>#スルー＝0点</span>
  </div>

  <nav><div class="tabs" role="tablist" id="tabs"></div></nav>
  <main id="main"></main>
</div>

<div class="bar"><div class="in">
  <div class="prog" id="prog"></div>
  <button class="btn primary" id="saveBtn">保存</button>
</div></div>

<div class="toast" id="toast"></div>

<script>

  {id:"area", label:"宿エリア", emoji:"🏨", head:"泊まるならどのエリア？", sub:"宿選びの参考に。2泊なので拠点は1か所の想定。"},

const MEMBERS = {takuya:"たくや", kensan:"けんさん", takechan:"たけちゃん", ryohe:"りょへ"};

  "a-myeongdong":"명동","a-hongdae":"홍대입구역","a-seongsu":"성수동","a-ddp":"동대문","a-gangnam":"강남역","a-jongno":"인사동",
  "s-gyeongbok":"경복궁","s-bukchon":"북촌한옥마을","s-ikseon":"익선동","s-insadong":"인사동","s-namsan":"N서울타워","s-gwangjang":"광장시장",
  "s-mangwon":"망원시장","s-seongsu":"성수동 카페거리","s-hongdae":"연남동","s-hannam":"한남동","s-itaewon":"이태원","s-ddp":"동대문디자인플라자",
  "s-garosu":"가로수길","s-coex":"별마당도서관","s-lotte-tower":"서울스카이","s-lotte-world":"롯데월드","s-hangang":"여의도한강공원",
  "x-hanbok":"경복궁 한복대여","x-jjim":"찜질방","x-olive":"올리브영 명동","x-pcolor":"퍼스널컬러 진단","x-4cut":"인생네컷",
  "x-kpop":"케이팝 굿즈","x-ramyeon":"한강공원 편의점","x-esthe":"마사지","x-market":"야시장",
  "f-samgyeop":"삼겹살","f-hanwoo":"한우","f-galbi":"돼지갈비","f-dakhan":"닭한마리","f-samgye":"삼계탕","f-gejang":"간장게장",
  "f-chimaek":"치킨 호프","f-tteok":"떡볶이","f-gwangjang":"광장시장 먹자골목","f-naengmyeon":"냉면","f-kalguk":"칼국수","f-seolleong":"설렁탕",
  "f-bossam":"보쌈 족발","f-budae":"부대찌개","f-gopchang":"곱창","f-jajang":"짜장면","f-hotteok":"호떡","f-cafe":"빙수 카페"
};
function linksFor(i){
  const enc = encodeURIComponent;
  const jaName = i.n.replace(/（.*?）/g,"");
  const kr = KR[i.id] || jaName;
  const out = [];
  if(i.cat === "food" || i.cat === "exp"){
    out.push(`<a href="https://www.google.com/search?q=${enc("ソウル " + jaName + " おすすめ")}" target="_blank" rel="noopener">🔍 おすすめ店を検索</a>`);
    out.push(`<a href="https://www.google.com/search?tbm=isch&q=${enc(jaName + " ソウル")}" target="_blank" rel="noopener">🖼 写真</a>`);
    out.push(`<a href="https://map.naver.com/p/search/${enc(kr)}" target="_blank" rel="noopener">🗺 NAVERで店を探す</a>`);
  }else{
    out.push(`<a href="https://www.google.com/maps/search/?api=1&query=${enc(jaName + " ソウル")}" target="_blank" rel="noopener">📍 Googleマップ</a>`);
    out.push(`<a href="https://map.naver.com/p/search/${enc(kr)}" target="_blank" rel="noopener">🗺 NAVERマップ</a>`);
    out.push(`<a href="https://www.google.com/search?tbm=isch&q=${enc(jaName + " ソウル")}" target="_blank" rel="noopener">🖼 写真</a>`);
    out.push(`<a href="https://www.google.com/search?q=${enc(jaName + " ソウル 観光")}" target="_blank" rel="noopener">🔍 詳しく</a>`);
  }
  return out.join("");
}

// ---------- state ----------
const LS = "seoul-survey-v1";
let state = {name:"", picks:{}, memo:"", drafts:{}};  // drafts: 名前ごとの下書き
let tab = "area";
let db = null;
let allVotes = {};      // id -> {name, picks, memo, updatedAt}
let dbStatus = "connecting"; // connecting | live | stale | off | readonly
let dbTimer = null;
let saving = false;

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS) || "null");
    if(s && typeof s === "object") state = Object.assign(state, s);
  }catch(e){}
}
function persist(){
  if(state.name) state.drafts[state.name] = {picks: Object.assign({}, state.picks), memo: state.memo};
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
}
function hasPicks(o){ return !!(o && o.picks && Object.keys(o.picks).length); }
// 名前を切り替えた時：その人の下書き → なければ保存済みの回答 → なければ空
function switchTo(key){
  state.name = key;
  const draft = state.drafts[key];
  const saved = allVotes[key];
  let msg = "";
  if(draft && (hasPicks(draft) || (draft.memo||"").trim())){
    state.picks = Object.assign({}, draft.picks); state.memo = String(draft.memo || "");
  }else if(saved){
    state.picks = Object.assign({}, saved.picks || {}); state.memo = String(saved.memo || "");
    msg = "前に保存した回答を読み込んだよ";
  }else{
    state.picks = {}; state.memo = "";
  }
  persist(); renderAll();
  if(msg) toast(msg);
}

// ---------- helpers ----------
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2600);
}
function catItems(c){ return ITEMS.filter(i => i.cat === c); }
function answeredCount(c){ return catItems(c).filter(i => state.picks[i.id] !== undefined).length; }

// ---------- render ----------
function renderTabs(){
  $("#tabs").innerHTML = CATS.map(c => {
    let cnt = "";
    if(["area","spot","exp","food"].includes(c.id)) cnt = `<span class="cnt">${answeredCount(c.id)}/${catItems(c.id).length}</span>`;
    return `<button class="tab" role="tab" data-tab="${c.id}" aria-selected="${tab===c.id}">${c.emoji} ${c.label}${cnt}</button>`;
  }).join("");
}

function renderMain(){
  const c = CATS.find(x => x.id === tab);
  let html = `<div class="sechead"><h2>${c.emoji} ${c.head}</h2><p>${c.sub}</p></div>`;
  if(tab === "memo"){
    html += `<textarea id="memo" placeholder="例：辛いもの苦手／カジノ行ってみたい／初日は夕方着…">${esc(state.memo)}</textarea>`;
  }else if(tab === "result"){
    html += renderResults();
  }else{
    html += `<div class="grid">` + catItems(tab).map(i => {
      const v = state.picks[i.id];
      return `<div class="item ${v===2?"v2":v===1?"v1":""}">
        <div class="emo" aria-hidden="true">${i.e}</div>
        <div class="ttl"><b>${esc(i.n)}</b><span class="tag">${esc(i.t)}</span></div>
        <p class="desc">${esc(i.d)}</p>
        <div class="votes">
          <button class="vb" data-id="${i.id}" data-v="2" aria-pressed="${v===2}">#マスト</button>
          <button class="vb" data-id="${i.id}" data-v="1" aria-pressed="${v===1}">#できれば</button>
          <button class="vb" data-id="${i.id}" data-v="0" aria-pressed="${v===0}">#スルー</button>
        </div>
        <div class="links">${linksFor(i)}</div>
      </div>`;
    }).join("") + `</div>`;
  }
  $("#main").innerHTML = html;
  const m = $("#memo");
  if(m) m.addEventListener("input", e => { if(!state.name){ e.target.value=""; toast("先に名前を選んでね"); return; } state.memo = e.target.value; persist(); });
}

function renderResults(){
  let html = "";
  const voters = Object.entries(allVotes);
  if(dbStatus === "off" || dbStatus === "readonly"){
    html += `<div class="status">集計データにつながってないみたい。<br>電波を確認して、ページを再読み込みしてみて。${voters.length ? "" : "下は<b>自分の回答だけ</b>のプレビュー。"}</div>`;
  }else if(dbStatus === "connecting"){
    html += `<div class="status">集計データを読み込み中…</div>`;
  }else if(dbStatus === "stale"){
    html += `<div class="status">集計データにまだつながらない…。表示が古いかも。</div>`;
  }
  let pool = voters;
  if(!voters.length && (dbStatus === "off" || dbStatus === "readonly")){
    pool = [["me", {name: MEMBERS[state.name] || "自分", picks: state.picks, memo: state.memo}]];
  }
  if(!pool.length){ return html + `<div class="empty">まだ誰も保存してない。最初の1人になろう。</div>`; }

  html += `<div class="voters">` + pool.map(([id,v]) => `<span class="chip">${esc(v.name || "名無し")}</span>`).join("") + `<span class="chip" style="background:transparent;border-style:dashed">${pool.length}人回答</span></div>`;

  for(const c of CATS.filter(x => ["area","spot","exp","food"].includes(x.id))){
    const rows = catItems(c.id).map(i => {
      const must = [], maybe = [];
      for(const [id,v] of pool){
        const p = v.picks && v.picks[i.id];
        if(p === 2) must.push(v.name || "名無し");
        else if(p === 1) maybe.push(v.name || "名無し");
      }
      return {i, must, maybe, score: must.length*2 + maybe.length};
    }).filter(r => r.score > 0).sort((a,b) => b.score - a.score || b.must.length - a.must.length);

    html += `<div class="rcat">${c.emoji} ${c.label}</div>`;
    if(!rows.length){ html += `<div class="empty" style="padding:6px 4px">まだ票なし</div>`; continue; }
    let prev = null, rank = 0;
    rows.forEach((r, idx) => {
      if(r.score !== prev){ rank = idx + 1; prev = r.score; }
      const max = pool.length * 2;
      let bars = "";
      for(let k=0;k<r.must.length;k++) bars += `<i class="m"></i><i class="m"></i>`;
      for(let k=0;k<r.maybe.length;k++) bars += `<i class="y"></i>`;
      for(let k=r.score;k<max;k++) bars += `<i></i>`;
      html += `<div class="rrow ${rank===1?"top":""}">
        <div class="rank">${rank}</div>
        <div><div class="rname">${r.i.e} ${esc(r.i.n)}</div>
          <div class="rwho">${r.must.length?`<span class="m">#マスト</span> ${r.must.map(esc).join("・")}　`:""}${r.maybe.length?`<span class="y">#できれば</span> ${r.maybe.map(esc).join("・")}`:""}</div></div>
        <div><div class="meter">${bars}</div><div class="score">${r.score}点</div></div>
      </div>`;
    });
  }

  const memos = pool.filter(([id,v]) => v.memo && v.memo.trim());
  html += `<div class="rcat">💬 ひとこと</div>`;
  html += memos.length ? `<div class="comments">` + memos.map(([id,v]) => `<div class="cm"><b>${esc(v.name || "名無し")}</b>${esc(v.memo)}</div>`).join("") + `</div>` : `<div class="empty" style="padding:6px 4px">まだなし</div>`;
  return html;
}

function renderBar(){
  const total = ITEMS.length;
  const done = Object.keys(state.picks).filter(k => ITEMS.some(i => i.id === k)).length;
  const must = Object.values(state.picks).filter(v => v === 2).length;
  $("#prog").innerHTML = `<strong>${done}/${total}</strong> 回答済み<br>#マスト ${must}件`;
  const sb = $("#saveBtn");
  sb.disabled = saving || dbStatus === "off";
  sb.textContent = saving ? "保存中…" : (dbStatus === "off") ? "保存不可" : "保存";
}

function renderAll(){ renderTabs(); renderMain(); renderBar(); }


// ---------- events ----------
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]");
  if(t){ tab = t.dataset.tab; renderAll(); window.scrollTo({top: $("nav").offsetTop - 0, behavior:"smooth"}); return; }
  const v = e.target.closest(".vb");
  if(v){
    if(!state.name){ toast("先に名前を選んでね"); $("#name").focus(); window.scrollTo({top:0, behavior:"smooth"}); return; }
    const id = v.dataset.id, val = Number(v.dataset.v);
    if(state.picks[id] === val) delete state.picks[id]; else state.picks[id] = val;
    persist(); renderTabs(); renderBar();
    const card = v.closest(".item");
    card.classList.toggle("v2", state.picks[id] === 2);
    card.classList.toggle("v1", state.picks[id] === 1);
    card.querySelectorAll(".vb").forEach(b => b.setAttribute("aria-pressed", String(state.picks[id] === Number(b.dataset.v))));
  }
});

$("#name").addEventListener("change", e => { switchTo(e.target.value); });


$("#saveBtn").addEventListener("click", async () => {
  if(!state.name){ toast("先に名前を選んでね"); $("#name").focus(); return; }
  if(!db){ toast("保存先につながってない…再読み込みしてみて"); return; }
  saving = true; renderBar();
  const body = {name: MEMBERS[state.name], key: state.name, picks: Object.assign({}, state.picks), memo: state.memo.slice(0,1000), updatedAt: new Date().toISOString()};
  try{
    await saveVote(state.name, body);
    toast("保存した！集計タブで見れるよ");
  }catch(err){
    console.error(err);
    toast("保存に失敗…。電波を確認してもう一回押してみて");
  }
  saving = false; renderAll();
});

const FB_VER = "10.12.2";
let fs = null; // firestore関数たち

async function saveVote(key, body){
  await fs.setDoc(fs.doc(db, "votes", key), body);
}

async function initDb(){
  if(!firebaseConfig.apiKey || !firebaseConfig.projectId){
    console.warn("firebaseConfig が未設定です");
    dbStatus = "off"; renderAll(); return;
  }
  try{
    const appMod = await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`);
    fs = await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`);
    const app = appMod.initializeApp(firebaseConfig);
    db = fs.getFirestore(app);
  }catch(e){
    console.error(e); db = null; dbStatus = "off"; renderAll(); return;
  }
  dbTimer = setTimeout(() => { if(dbStatus === "connecting"){ dbStatus = "stale"; renderAll(); } }, 10000);
  fs.onSnapshot(fs.collection(db, "votes"), snap => {
    const next = {};
    snap.docs.forEach(d => { const v = d.data(); if(v && typeof v === "object" && MEMBERS[d.id]) next[d.id] = Object.assign({}, v, {name: MEMBERS[d.id]}); });
    allVotes = next;
    clearTimeout(dbTimer); dbStatus = "live";
    const mine = state.name && next[state.name];
    const d = state.name && state.drafts[state.name];
    if(mine && !hasPicks(d) && !hasPicks(state)){
      state.picks = Object.assign({}, mine.picks || {}); state.memo = String(mine.memo || ""); persist();
    }
    renderAll();
  }, err => {
    console.error(err); clearTimeout(dbTimer); dbStatus = "off"; renderAll();
  });
  renderAll();
}

// ---------- boot ----------
load();
if(!state.drafts || typeof state.drafts !== "object") state.drafts = {};
if(!MEMBERS[state.name]){ state.name = ""; state.picks = {}; state.memo = ""; }
else if(!state.drafts[state.name]) persist();
$("#name").value = state.name;
renderAll();
initDb();
</script>
